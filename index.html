<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      background: white;
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 420px;
      width: 90vw;
    }

    h1 {
      font-size: 2rem;
      color: #4a4a8a;
      margin-bottom: 8px;
    }

    .scores {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 12px 0 20px;
    }

    .score-box {
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
    }

    .score-box.x { background: #fff0f0; color: #e05252; border: 2px solid #e05252; }
    .score-box.o { background: #f0f4ff; color: #5277e0; border: 2px solid #5277e0; }
    .score-box.tie { background: #f5f5f5; color: #777; border: 2px solid #ccc; }

    .status {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 16px;
      min-height: 32px;
      color: #333;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 auto 20px;
    }

    .cell {
      aspect-ratio: 1;
      background: #f8f8ff;
      border: 3px solid #ddd;
      border-radius: 14px;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #eeeeff;
      transform: scale(1.04);
    }

    .cell.x { color: #e05252; }
    .cell.o { color: #5277e0; }
    .cell.taken { cursor: default; }

    .cell.winning {
      background: #fffacd;
      border-color: #f5c518;
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.03); }

    .btn-restart {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-reset {
      background: #f0f0f0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⭕ Tic Tac Toe ❌</h1>

    <div class="scores">
      <div class="score-box x">❌ X: <span id="score-x">0</span></div>
      <div class="score-box tie">Ties: <span id="score-tie">0</span></div>
      <div class="score-box o">⭕ O: <span id="score-o">0</span></div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="buttons">
      <button class="btn-restart" id="btn-restart">New Game</button>
      <button class="btn-reset" id="btn-reset">Reset Scores</button>
    </div>
  </div>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8], // rows
      [0,3,6],[1,4,7],[2,5,8], // cols
      [0,4,8],[2,4,6]          // diagonals
    ];

    let board = Array(9).fill(null);
    let current = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, Tie: 0 };

    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');

    function checkWinner() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], line: [a, b, c] };
        }
      }
      if (board.every(Boolean)) return { winner: null, line: [] };
      return null;
    }

    function render() {
      cells.forEach((cell, i) => {
        cell.textContent = board[i] === 'X' ? '❌' : board[i] === 'O' ? '⭕' : '';
        cell.className = 'cell' + (board[i] ? ` ${board[i].toLowerCase()} taken` : '');
      });
      document.getElementById('score-x').textContent = scores.X;
      document.getElementById('score-o').textContent = scores.O;
      document.getElementById('score-tie').textContent = scores.Tie;
    }

    function handleClick(e) {
      const idx = parseInt(e.currentTarget.dataset.index);
      if (gameOver || board[idx]) return;

      board[idx] = current;
      render();

      const result = checkWinner();
      if (result) {
        gameOver = true;
        if (result.winner) {
          scores[result.winner]++;
          status.textContent = `Player ${result.winner} wins! 🎉`;
          result.line.forEach(i => cells[i].classList.add('winning'));
        } else {
          scores.Tie++;
          status.textContent = "It's a tie! 🤝";
        }
        render();
      } else {
        current = current === 'X' ? 'O' : 'X';
        status.textContent = `Player ${current}'s turn`;
      }
    }

    function newGame() {
      board = Array(9).fill(null);
      gameOver = false;
      current = 'X';
      status.textContent = "Player X's turn";
      render();
    }

    function resetScores() {
      scores = { X: 0, O: 0, Tie: 0 };
      newGame();
    }

    cells.forEach(cell => cell.addEventListener('click', handleClick));
    document.getElementById('btn-restart').addEventListener('click', newGame);
    document.getElementById('btn-reset').addEventListener('click', resetScores);

    render();
  </script>
</body>
</html>
